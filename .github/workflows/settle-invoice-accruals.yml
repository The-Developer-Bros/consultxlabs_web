name: Settle Invoice Accruals

# #771 / #749 — monthly consolidated rollup cron: rolls each org's unbilled
# INVOICE_ACCRUAL / OVERAGE_INVOICE_ACCRUAL bookings into one OrganizationInvoice.
# Financial cron (see FINANCIAL_JOB_NAMES) — skipped in DEGRADED maintenance.

on:
  schedule:
    # 04:00 UTC = 09:30 IST on the 1st of every month. GitHub Actions `schedule`
    # interprets cron in UTC. Monthly because rolling up the same ISSUED invoices
    # twice would create duplicate parent invoices (the cron is a one-shot per
    # cycle); runs well after generate-subscription-invoices (01:00 UTC).
    - cron: "0 4 1 * *"
  workflow_dispatch: # Allow manual triggering

# #813 — never let two rollup runs overlap. Queue a new run behind an in-flight
# one (do NOT cancel — a mid-flight invoice issue must finish) so the find-then-stamp
# can't double-bill. Belt to the in-code Serializable in-tx read's suspenders.
concurrency:
  group: settle-invoice-accruals
  cancel-in-progress: false

jobs:
  settle-invoice-accruals:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # #1066 — jobs run as bare Node processes, so Sentry.init only sees
      # what the step env carries. Without the DSN the runner initialises
      # a disabled client and every captureException is a no-op again.
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN || secrets.SENTRY_DSN }}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      # The cron is a no-op when this flag is unset / "false". GH Actions
      # secrets store the live value per-environment (prod / staging).
      ENABLE_CONSOLIDATED_INVOICE: ${{ secrets.ENABLE_CONSOLIDATED_INVOICE }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run settle invoice accruals job
        run: npx --yes tsx@4.23.1 jobs/billing/settle-invoice-accruals.ts

      - name: Notify on failure
        if: failure()
        env:
          SLACK_OPS_WEBHOOK_URL: ${{ secrets.SLACK_OPS_WEBHOOK_URL }}
          # Fallback sink — Slack has never been provisioned, so this is
          # what actually pages today. See 07-required-secrets.md.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: bash scripts/ci/notify-ops-failure.sh "settle-invoice-accruals"
