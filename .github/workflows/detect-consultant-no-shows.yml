name: Detect Consultant No-Shows

on:
  schedule:
    # Run hourly (offset to avoid colliding with other :00/:07 crons)
    - cron: "57 * * * *"
  workflow_dispatch: # Allow manual triggering

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  detect-consultant-no-shows:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # #1066 — jobs run as bare Node processes, so Sentry.init only sees
      # what the step env carries. Without the DSN the runner initialises
      # a disabled client and every captureException is a no-op again.
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN || secrets.SENTRY_DSN }}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: production
      # Database connection (required for Prisma)
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      # #476 cron locks load lib/redis at import — every job entry needs these
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      # #471 auto-refund reuses refundPayment (#990) — gateway creds for parity
      # with the other money jobs (reconcile-pending-refunds).
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
      RAZORPAY_SECRET: ${{ secrets.RAZORPAY_SECRET }}
      # Both-party no-show + refund notifications
      NOVU_SECRET_KEY: ${{ secrets.NOVU_SECRET_KEY }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Detect consultant no-shows
        run: npx --yes tsx@4.23.1 jobs/appointments/detect-consultant-no-shows.ts

      - name: Notify on failure
        if: failure()
        env:
          SLACK_OPS_WEBHOOK_URL: ${{ secrets.SLACK_OPS_WEBHOOK_URL }}
          # Fallback sink — Slack has never been provisioned, so this is
          # what actually pages today. See 07-required-secrets.md.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: bash scripts/ci/notify-ops-failure.sh "detect-consultant-no-shows"
