name: Retry Failed Emails

# #474 — transactional-email dead-letter retry. lib/email.ts persists a rendered
# FailedEmail row when a Resend send fails; this worker re-sends due rows, walks
# the 1m/5m/30m/2h/8h backoff, and dead-letters once exhausted (operator-replayable
# via the admin route). Every 15 minutes is enough granularity for the backoff
# slots without churning a low-volume failure table.

on:
  schedule:
    # ADR 22 — this schedule is an upper bound on frequency, not a delivered cadence; ADR 27 — the Netlify ticker (netlify/functions/cron-tick.mts) is what actually holds the cadence for the money sweeps.
    - cron: "5-59/15 * * * *"
  workflow_dispatch: # Allow manual triggering

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  retry-failed-emails:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # #1066 — jobs run as bare Node processes, so Sentry.init only sees
      # what the step env carries. Without the DSN the runner initialises
      # a disabled client and every captureException is a no-op again.
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN || secrets.SENTRY_DSN }}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      # #476 — fail-closed cron lock: without these the job refuses to run.
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      # The whole point — the worker re-sends through Resend.
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run failed-email retry job
        run: npx --yes tsx@4.23.1 jobs/email/retry-failed-emails.ts

      - name: Notify on failure
        if: failure()
        env:
          SLACK_OPS_WEBHOOK_URL: ${{ secrets.SLACK_OPS_WEBHOOK_URL }}
          # Fallback sink — Slack has never been provisioned, so this is
          # what actually pages today. See 07-required-secrets.md.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: bash scripts/ci/notify-ops-failure.sh "retry-failed-emails"
