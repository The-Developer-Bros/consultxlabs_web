name: Generate Subscription Invoices

# #681 — daily BillingSubscription invoice generation: bills every
# subscription whose nextInvoiceDate is due and fires the 7-day renewal
# reminders. Financial cron (see FINANCIAL_JOB_NAMES) — skipped in DEGRADED.

on:
  schedule:
    # 01:00 UTC = 06:30 IST. GitHub Actions `schedule` interprets cron in
    # UTC. Runs before settle-invoice-accruals (01:30 UTC) so subscription
    # invoices exist before the accrual rollup reads.
    - cron: "0 1 * * *"
  workflow_dispatch: # Allow manual triggering

# #813 — never let two invoice-gen runs overlap. Queue a new run behind an
# in-flight one (do NOT cancel — a mid-flight invoice issue must finish) so the
# find-then-claim can't double-bill. Belt to the in-code atomic claim's suspenders.
concurrency:
  group: generate-subscription-invoices
  cancel-in-progress: false

jobs:
  generate-subscription-invoices:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # #1066 — jobs run as bare Node processes, so Sentry.init only sees
      # what the step env carries. Without the DSN the runner initialises
      # a disabled client and every captureException is a no-op again.
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN || secrets.SENTRY_DSN }}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      NOVU_SECRET_KEY: ${{ secrets.NOVU_SECRET_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run generate subscription invoices job
        run: npx --yes tsx@4.23.1 jobs/billing/generate-subscription-invoices.ts

      - name: Notify on failure
        if: failure()
        env:
          SLACK_OPS_WEBHOOK_URL: ${{ secrets.SLACK_OPS_WEBHOOK_URL }}
          # Fallback sink — Slack has never been provisioned, so this is
          # what actually pages today. See 07-required-secrets.md.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: bash scripts/ci/notify-ops-failure.sh "generate-subscription-invoices"
