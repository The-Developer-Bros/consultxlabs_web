name: Process Payouts

on:
  schedule:
    # Run weekly on Mondays at 9:00 PM UTC (2:30 AM IST next day)
    - cron: "0 21 * * 1"
  workflow_dispatch: # Allow manual triggering

# #776 — never let two payout runs overlap. Queue a new run behind an in-flight
# one (do NOT cancel — a mid-flight disbursement must finish) so the find-then-claim
# can't double-submit to the gateway. Belt to the in-code atomic claim's suspenders.
concurrency:
  group: process-payouts
  cancel-in-progress: false

jobs:
  process-payouts:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # #1066 — jobs run as bare Node processes, so Sentry.init only sees
      # what the step env carries. Without the DSN the runner initialises
      # a disabled client and every captureException is a no-op again.
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN || secrets.SENTRY_DSN }}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: production
      # Database connection (required for Prisma)
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # #476 cron locks load lib/redis at import — every job entry needs these
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # RazorpayX credentials for payouts.
      # #850 — the payout service reads RAZORPAYX_KEY_SECRET || RAZORPAY_SECRET
      # (razorpay-payouts.ts), NOT RAZORPAY_KEY_SECRET; both env names are set
      # so the service and any legacy readers resolve the same secret.
      # The repo secret is named RAZORPAY_SECRET — sourcing either env var from
      # `secrets.RAZORPAY_KEY_SECRET` silently yields an empty string, which is
      # how #677 PM-1 came back after being fixed in application code.
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
      RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_SECRET }}
      RAZORPAY_SECRET: ${{ secrets.RAZORPAY_SECRET }}
      RAZORPAYX_ACCOUNT_NUMBER: ${{ secrets.RAZORPAYX_ACCOUNT_NUMBER }}

      # Stripe credentials for Connect transfers
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run process payouts job
        run: npx --yes tsx@4.23.1 jobs/payouts/process-payouts.ts

      - name: Notify on failure
        if: failure()
        env:
          SLACK_OPS_WEBHOOK_URL: ${{ secrets.SLACK_OPS_WEBHOOK_URL }}
          # Fallback sink — Slack has never been provisioned, so this is
          # what actually pages today. See 07-required-secrets.md.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: bash scripts/ci/notify-ops-failure.sh "process-payouts"
