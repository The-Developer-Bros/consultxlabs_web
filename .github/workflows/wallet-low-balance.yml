name: Wallet Low Balance

# #777 §C — daily wallet low-balance alert: notifies finance when a WALLET
# account dips below its configured minimum. NOTIFY-ONLY — no money moves and
# no WalletTopUp row is created until payment mandates land.

on:
  schedule:
    # 23:45 UTC = 05:15 IST. Quiet slot — after the 23:30 UTC dunning cron,
    # no other cron fires at 23:xx.
    - cron: "45 23 * * *"
  workflow_dispatch: # Allow manual triggering

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  wallet-low-balance:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # #1066 — jobs run as bare Node processes, so Sentry.init only sees
      # what the step env carries. Without the DSN the runner initialises
      # a disabled client and every captureException is a no-op again.
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN || secrets.SENTRY_DSN }}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # #476 cron locks load lib/redis at import — every job entry needs these
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      NOVU_SECRET_KEY: ${{ secrets.NOVU_SECRET_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run wallet-low-balance job
        run: npx --yes tsx@4.23.1 jobs/billing/wallet-low-balance.ts

      - name: Notify on failure
        if: failure()
        env:
          SLACK_OPS_WEBHOOK_URL: ${{ secrets.SLACK_OPS_WEBHOOK_URL }}
          # Fallback sink — Slack has never been provisioned, so this is
          # what actually pages today. See 07-required-secrets.md.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: bash scripts/ci/notify-ops-failure.sh "wallet-low-balance"
