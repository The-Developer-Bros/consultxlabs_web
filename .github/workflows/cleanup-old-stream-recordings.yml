name: Cleanup Old Stream Recordings

on:
  schedule:
    # 03:00 UTC daily. Staggered after abandoned-top-ups (02:00) and
    # reconcile-ledgers (02:30) to avoid Prisma pool contention.
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  # A second workflow_dispatch while one is already pending would replace it
  # under the default single-pending-run policy; queue: max keeps every
  # trigger instead of silently dropping one.
  queue: max

jobs:
  cleanup-old-stream-recordings:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # #1066 — jobs run as bare Node processes, so Sentry.init only sees
      # what the step env carries. Without the DSN the runner initialises
      # a disabled client and every captureException is a no-op again.
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN || secrets.SENTRY_DSN }}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # #476 cron locks load lib/redis at import — every job entry needs these
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      # #1270 — `lib/supabase.ts` THROWS at module scope when either of these
      # is unset, and this entrypoint reaches it transitively (job →
      # RecordingTransferService → lib/supabase). The job therefore died during
      # import, before a single row was read, on every run it has ever had.
      # The anon key is required even where only the admin client is used: the
      # module builds the public client first and throws before it gets there.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # Deleting the Supabase object behind an expired recording needs the
      # admin client; without it the delete silently fails RLS and the bytes
      # outlive the retention window (the DPDP half of #1270).
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - run: npx --yes tsx@4.23.1 jobs/cleanup/cleanup-old-stream-recordings.ts
      - name: Notify on failure
        if: failure()
        env:
          SLACK_OPS_WEBHOOK_URL: ${{ secrets.SLACK_OPS_WEBHOOK_URL }}
          # Fallback sink — Slack has never been provisioned, so this is
          # what actually pages today. See 07-required-secrets.md.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: bash scripts/ci/notify-ops-failure.sh "cleanup-old-stream-recordings"
