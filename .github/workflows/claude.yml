name: Claude Code

# CodeRabbit is the reviewer of record on this repository; this workflow is the
# separate @claude mention trigger, gated by the `CLAUDE_ACTION_ENABLED`
# repository variable so an accidental "@claude" in a comment does not run
# and fail loudly while `CLAUDE_CODE_OAUTH_TOKEN` is expired. Every run has
# failed since the token expired (`API Error: 401 ... OAuth access token has
# expired`).
#
# To bring this back: rotate the token by running `claude setup-token`
# locally and updating the `CLAUDE_CODE_OAUTH_TOKEN` repository secret (or
# switch the `with:` block below to `anthropic_api_key: ${{
# secrets.ANTHROPIC_API_KEY }}` instead), then set the `CLAUDE_ACTION_ENABLED`
# repository variable to `true`. The action is pinned to its current major
# tag (`@v1`) rather than `@beta` — see the migration guide at
# https://github.com/anthropics/claude-code-action/blob/main/docs/migration-guide.md.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      vars.CLAUDE_ACTION_ENABLED == 'true' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Specify model (defaults to Claude Sonnet 4, uncomment for Claude Opus 4)
          # model: "claude-opus-4-20250514"

          # Optional: Customize the trigger phrase (default: @claude)
          # trigger_phrase: "/claude"

          # Optional: Trigger when specific user is assigned to an issue
          # assignee_trigger: "claude-bot"

          # Optional: Allow Claude to run specific commands
          # allowed_tools: "Bash(npm install),Bash(npm run build),Bash(npm run test:*),Bash(npm run lint:*)"

          # Optional: Add custom instructions for Claude to customize its behavior for your project
          # custom_instructions: |
          #   Follow our coding standards
          #   Ensure all new code has tests
          #   Use TypeScript for new files

          # Optional: Custom environment variables for Claude
          # claude_env: |
          #   NODE_ENV: test
