# SonarQube Cloud Automatic Analysis reads THIS file (`.sonarcloud.properties`),
# not `sonar-project.properties` (that one is for the future CI-based scan).
# Scope Automatic Analysis to app source: exclude generated output, vendored
# code, type declarations, seeds/migrations, and non-source assets so they don't
# inflate the issue/duplication counts. Coverage still requires a CI scan.
# `prisma/sql/**` is hand-written DDL against a Prisma-generated schema, so it
# must quote every identifier: Postgres folds unquoted names to lowercase, and
# the schema's names are PascalCase — `ALTER TYPE PaymentGateway` would look for
# `paymentgateway` and fail. Sonar's generic SQL rules assume snake_case and flag
# the required quoting as a smell, so the findings are always wrong here and
# following them would break the migration. Excluded for the same reason
# prisma/migrations/** already is.
sonar.exclusions=**/node_modules/**,.next/**,coverage/**,**/*.d.ts,prisma/migrations/**,prisma/seedFiles/**,prisma/sql/**,public/**,emails/**,docs/**,load-tests/**,testsprite_tests/**
# Test suites repeat mock scaffolding by design (jest.mock is per-file and
# hoisted); duplication there is not a maintainability signal. #1330 already
# excluded __tests__/**,tests/** from CPD in sonar-project.properties for the
# future CI-based scan, but missed this file — the one Automatic Analysis
# actually reads — so every PR that added test coverage kept failing the
# new-code duplication gate on boilerplate the CI-scan config had already
# written off.
sonar.cpd.exclusions=__tests__/**,tests/**
